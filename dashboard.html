<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Ingressos</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #07070f;
      --surface: #0e0e1a;
      --card: #131320;
      --border: #1c1c30;
      --accent: #e8e8f2;
      --red: #ff4d6d;
      --yellow: #ffd60a;
      --text: #e8e8f2;
      --muted: #52527a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(7, 7, 15, 0.95);
      backdrop-filter: blur(16px);
      z-index: 50;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 4px;
    }

    .logo em {
      color: var(--accent);
      font-style: normal;
    }

    .header-right {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .gh-btn:hover {
      border-color: rgba(232, 232, 242, 0.3);
      color: var(--text);
    }

    .gh-btn.configured {
      border-color: rgba(232, 232, 242, 0.25);
      color: var(--text);
    }

    .gh-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .gh-modal-overlay.open {
      display: flex;
    }

    .gh-modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      width: 380px;
      max-width: 90vw;
    }

    .gh-modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .gh-field {
      margin-bottom: 14px;
    }

    .gh-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gh-field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
    }

    .gh-field input:focus {
      border-color: rgba(232, 232, 242, 0.2);
    }

    .gh-modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .gh-save-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 7px 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .gh-cancel-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 12px;
      cursor: pointer;
    }

    .header-center {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    .jogo-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
    }

    .selector-label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .jogo-selector input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      width: 220px;
    }

    .jogo-selector input::placeholder {
      color: var(--muted);
    }

    .jogo-selector button {
      background: var(--accent);
      color: #07070f;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .jogo-selector button:hover {
      opacity: 0.85;
    }

    .jogo-selector button.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* AREA DO JOGO SELECIONADO */
    .game-details-area {
      margin-top: 24px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* LISTA HORIZONTAL DE JOGOS */
    .games-horizontal-list {
      display: flex;
      overflow-x: auto;
      gap: 20px;
      padding: 10px 4px 24px 4px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      /* Hide scrollbar for cleaner look, but keep functionality */
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .games-horizontal-list::-webkit-scrollbar {
      height: 8px;
    }

    .games-horizontal-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .games-horizontal-list::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .games-horizontal-list::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* JOGO CARD (Horizontal) */
    .jogo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 28px;
      position: relative;
      overflow: hidden;
      min-width: 320px;
      max-width: 360px;
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.6;
      display: flex;
      flex-direction: column;
    }

    .jogo-card:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .jogo-card.active {
      opacity: 1;
      border-color: rgba(232, 232, 242, 0.25);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
      background: rgba(19, 19, 32, 0.9);
    }

    .jogo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #e8e8f2, #7c7c99);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .jogo-card.active::before {
      opacity: 1;
    }

    .jogo-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .jogo-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 600;
    }

    .game-remove-btn.icon-only {
      padding: 4px;
      font-size: 14px;
      border: none;
      opacity: 0.5;
    }

    .game-remove-btn.icon-only:hover {
      background: rgba(255, 77, 109, 0.1);
      opacity: 1;
    }

    .jogo-titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 1.5px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .jogo-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .meta-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .stat-chips {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 100%;
      text-align: center;
    }

    .chip.destaque {
      border-color: rgba(0, 255, 136, 0.3);
      color: var(--accent);
      background: rgba(0, 255, 136, 0.06);
    }

    .chip.alerta {
      border-color: rgba(255, 77, 109, 0.3);
      color: var(--red);
      background: rgba(255, 77, 109, 0.06);
    }

    /* PARCEIROS */
    .parceiros-titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--text);
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .parceiros-titulo::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .parceiro-accordion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }

    .parceiro-accordion:hover {
      border-color: rgba(255, 255, 255, 0.08);
    }

    .parceiro-accordion.aberto {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .parceiro-accordion.tem-mudanca {
      border-color: rgba(255, 77, 109, 0.35) !important;
    }

    .parceiro-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .parceiro-header:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .parceiro-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      flex-shrink: 0;
    }

    .parceiro-nome {
      font-weight: 600;
      font-size: 14px;
    }

    .parceiro-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .parceiro-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .preco-destaque {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .preco-destaque.sem {
      color: var(--muted);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
    }

    .badge-mudanca {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(255, 77, 109, 0.15);
      color: var(--red);
    }

    .badge-ok {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.07);
      color: var(--muted);
    }

    .badge-erro {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      background: rgba(255, 77, 109, 0.1);
      color: var(--red);
    }

    .chevron {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.25s;
      width: 16px;
      text-align: center;
    }

    .aberto .chevron {
      transform: rotate(180deg);
    }

    /* BODY DO ACCORDION */
    .parceiro-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 16px 20px;
    }

    .aberto .parceiro-body {
      display: block;
    }

    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.2s;
    }

    .ticket-row.mudou {
      border-color: rgba(255, 77, 109, 0.3);
      background: rgba(255, 77, 109, 0.04);
    }

    .ticket-setor {
      font-size: 13px;
    }

    .ticket-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .ticket-preco {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .ticket-preco.sem {
      color: var(--muted);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
    }

    .parceiro-footer {
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
    }

    .parceiro-footer-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .link-site {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .link-site:hover {
      color: var(--accent);
    }

    .erro-msg {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .erro-msg a {
      color: var(--accent);
      text-decoration: none;
      font-size: 11px;
    }

    /* HISTORICO */
    .historico-wrap {
      margin-top: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .historico-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    td {
      padding: 12px 16px;
      font-size: 12px;
      border-bottom: 1px solid rgba(28, 28, 48, 0.5);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.015);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .pill-up {
      background: rgba(255, 77, 109, 0.12);
      color: var(--red);
    }

    .pill-down {
      background: rgba(0, 255, 136, 0.12);
      color: var(--accent);
    }

    .empty-hist {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 13px;
    }

    /* SEM DADOS */
    .no-data {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .no-data-icon {
      font-size: 52px;
      margin-bottom: 20px;
    }

    .no-data h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--text);
      margin-bottom: 12px;
    }

    code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent);
    }

    .game-remove-btn {
      background: transparent;
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: var(--red);
      border-radius: 6px;
      padding: 5px 13px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .game-remove-btn:hover {
      background: rgba(255, 77, 109, 0.1);
    }

    /* ADICIONAR JOGO */
    .add-game-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 32px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .add-game-label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .add-game-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
    }

    .add-game-row input::placeholder {
      color: var(--muted);
    }

    .add-game-date {
      flex: 0 0 auto !important;
      width: 120px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 12px !important;
      border-left: 1px solid var(--border) !important;
      padding-left: 10px !important;
    }

    .add-game-btn {
      background: var(--accent);
      color: #07070f;
      border: none;
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .add-game-btn:hover {
      opacity: 0.85;
    }

    .add-game-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .scrape-btn {
      background: var(--yellow);
      color: #07070f;
      border: none;
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .scrape-btn:hover {
      opacity: 0.85;
    }

    .scrape-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* PARCEIROS GRID */
    .parceiros-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      padding: 4px 0 20px;
    }

    .parceiro-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      transition: border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .parceiro-card:hover {
      border-color: rgba(255, 255, 255, 0.08);
    }

    .parceiro-card.tem-mudanca {
      border-color: rgba(255, 77, 109, 0.4);
    }

    .parceiro-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .parceiro-card-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .parceiro-card-name {
      font-size: 13px;
      font-weight: 600;
    }

    .parceiro-card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .parceiro-card-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      margin: 8px 0 12px;
    }

    .parceiro-card-price.sem {
      color: var(--muted);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
    }

    .parceiro-card-rows {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 4px 0 12px;
      flex: 1;
    }

    .parceiro-card-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0;
      border-bottom: 1px solid rgba(28, 28, 48, 0.5);
    }

    .parceiro-card-row.mudou {
      color: var(--red);
    }

    .parceiro-card-row .tk-p {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      font-size: 12px;
    }

    .parceiro-card-row.mudou .tk-p {
      color: var(--accent);
    }

    .parceiro-card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted);
      margin-top: auto;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 16px;
      }

      main {
        padding: 20px 12px;
      }

      .jogo-card {
        min-width: 280px;
      }

      .jogo-titulo {
        font-size: 24px;
      }

      .parceiros-grid {
        grid-template-columns: 1fr;
      }

      .add-game-row {
        flex-wrap: wrap;
      }

      .add-game-row input {
        min-width: 0;
      }

      .add-game-date {
        width: 100% !important;
        border-left: none !important;
        border-top: 1px solid var(--border) !important;
        padding-left: 0 !important;
      }

      .add-game-btn {
        width: 100%;
        margin-top: 4px;
      }

      .scrape-btn {
        width: 100%;
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo"><em>Ingressosssss</em> Parceiros</div>
    <div class="header-right">
      <span id="headerTime">—</span>
      <button class="gh-btn" id="ghBtn" onclick="abrirModalGH()">⚙ GitHub</button>
    </div>
  </header>

  <!-- Modal GitHub -->
  <div class="gh-modal-overlay" id="ghOverlay" onclick="fecharModalGH(event)">
    <div class="gh-modal">
      <h3>Configurar GitHub</h3>
      <div class="gh-field">
        <label>Usuário / Organização</label>
        <input id="ghOwner" placeholder="seu-usuario" />
      </div>
      <div class="gh-field">
        <label>Nome do repositório</label>
        <input id="ghRepo" placeholder="monitor-ingressos" />
      </div>
      <div class="gh-field">
        <label>Personal Access Token</label>
        <input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx" />
      </div>
      <div class="gh-modal-footer">
        <button class="gh-cancel-btn" onclick="fecharModalGH()">Cancelar</button>
        <button class="gh-save-btn" onclick="salvarConfigGH()">Salvar</button>
      </div>
    </div>
  </div>

  <main id="content">
    <div class="no-data">
      <div class="no-data-icon">⚙️</div>
      <h2>Nenhum dado ainda</h2>
      <p>Inicie o servidor e depois rode o scraper:</p>
      <br>
      <p><code>python server.py</code></p>
      <br>
      <p><code>python scraper.py</code></p>
      <br>
      <p style="font-size:11px; color:var(--muted)">Acesse via <code>http://localhost:8000</code></p>
    </div>
  </main>

  <script>
    // ── Dados ────────────────────────────────────────────────────
    let _dadosGlobais = null;
    let _configGlobal = null;
    let _jogoSelecionado = null;

    // ── GitHub API ───────────────────────────────────────────────
    function getGHConfig() {
      return {
        owner: localStorage.getItem('gh_owner') || '',
        repo: localStorage.getItem('gh_repo') || '',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function isGHConfigured() {
      const c = getGHConfig();
      return !!(c.owner && c.repo && c.token);
    }

    function abrirModalGH() {
      const c = getGHConfig();
      document.getElementById('ghOwner').value = c.owner;
      document.getElementById('ghRepo').value = c.repo;
      document.getElementById('ghToken').value = c.token;
      document.getElementById('ghOverlay').classList.add('open');
    }

    function fecharModalGH(e) {
      if (!e || e.target === document.getElementById('ghOverlay')) {
        document.getElementById('ghOverlay').classList.remove('open');
      }
    }

    function salvarConfigGH() {
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      document.getElementById('ghOverlay').classList.remove('open');
      atualizarBotaoGH();
      mostrarToast('✓ Configuração do GitHub salva!');
    }

    function atualizarBotaoGH() {
      const btn = document.getElementById('ghBtn');
      if (!btn) return;
      if (isGHConfigured()) {
        btn.textContent = '✓ GitHub';
        btn.classList.add('configured');
      } else {
        btn.textContent = '⚙ GitHub';
        btn.classList.remove('configured');
      }
    }

    async function ghUpdateConfig(novoConfig) {
      const { owner, repo, token } = getGHConfig();
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/config.json`;
      const headers = { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' };

      const r1 = await fetch(apiUrl, { headers });
      if (!r1.ok) throw new Error(`GitHub API ${r1.status}: verifique owner/repo/token`);
      const { sha } = await r1.json();

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(novoConfig, null, 2) + '\n')));
      const r2 = await fetch(apiUrl, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'chore: atualizar config via dashboard', content, sha })
      });
      if (!r2.ok) {
        const err = await r2.json().catch(() => ({}));
        throw new Error(err.message || `GitHub API ${r2.status}`);
      }
    }

    // ── Fetch ────────────────────────────────────────────────────
    async function carregar() {
      try {
        const t = Date.now();
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const [rPrices, rConfig] = await Promise.all([
          fetch("./prices.json?t=" + t),
          fetch(isLocal ? "/config?t=" + t : "./config.json?t=" + t)
        ]);
        const dados = rPrices.ok ? await rPrices.json() : {};
        const config = rConfig.ok ? await rConfig.json() : { jogos: [] };
        _dadosGlobais = dados;
        _configGlobal = config;
        renderizarTudo(dados, config);
        atualizarHeaderTime(dados);
        atualizarBotaoGH();
      } catch (e) {
        // mantém tela de instrução se não há dados
      }
    }

    // ── Parse data BR "DD/MM/YYYY HH:MM:SS" → timestamp ─────────
    function parseBRDate(s) {
      if (!s) return 0;
      const [date, time] = s.split(' ');
      if (!date || !time) return 0;
      const [d, m, y] = date.split('/');
      return new Date(`${y}-${m}-${d}T${time}`).getTime();
    }

    // ── Parse data simples "DD/MM/YYYY" → timestamp ──────────────
    function parseDateSimple(s) {
      if (!s) return Infinity;
      const [d, m, y] = s.split('/');
      if (!d || !m || !y) return Infinity;
      return new Date(`${y}-${m}-${d}`).getTime();
    }

    // ── Render principal ─────────────────────────────────────────
    function renderizarTudo(dados, config) {
      const content = document.getElementById("content");

      // Compatibilidade com formato antigo (flat)
      if (dados.jogo && dados.parceiros) {
        dados = {
          [dados.jogo]: {
            parceiros: dados.parceiros,
            atualizado_em: dados.atualizado_em,
            historico: dados.historico || []
          }
        };
      }

      // Monta lista de jogos a partir do config (inclui jogos sem dados ainda)
      const jogosConfig = (config?.jogos || []).map(j =>
        typeof j === 'string' ? { nome: j, data: '' } : j
      );

      // Jogos do prices.json que não estão no config (legado)
      const nomesConfig = new Set(jogosConfig.map(j => j.nome));
      Object.keys(dados).forEach(nome => {
        if (!nomesConfig.has(nome)) jogosConfig.push({ nome, data: '' });
      });

      // Ordena por data do jogo (mais próximo primeiro, sem data vai pro final)
      jogosConfig.sort((a, b) => parseDateSimple(a.data) - parseDateSimple(b.data));

      if (jogosConfig.length === 0) return;

      const jogosNomes = jogosConfig.map(j => j.nome);
      if (!_jogoSelecionado || !jogosNomes.includes(_jogoSelecionado)) {
        _jogoSelecionado = jogosNomes[0];
      }

      let html = `
    <!-- Top Bar: Adicionar Jogos -->
    <div class="add-game-row">
      <span class="add-game-label">＋ Jogo:</span>
      <input type="text" id="novoJogoInput" placeholder="Ex: Corinthians x Palmeiras" />
      <input type="text" id="novoJogoData" class="add-game-date" placeholder="DD/MM/AAAA" />
      <button class="add-game-btn" onclick="adicionarJogo()">Adicionar</button>
      <button class="scrape-btn" id="scrapeBtn" onclick="buscarPrecos()">Buscar Preços</button>
    </div>

    <!-- Lista Horizontal de Jogos -->
    <div class="games-horizontal-list">
  `;

      jogosConfig.forEach(jogoConf => {
        const dadosJogo = dados[jogoConf.nome] || null;
        html += getGameCardHtml(jogoConf.nome, jogoConf.data, dadosJogo, jogoConf.nome === _jogoSelecionado);
      });

      html += `
    </div>

    <!-- Área de Detalhes do Jogo Selecionado -->
    <div id="game-details-area" class="game-details-area">
      <!-- Injetado via renderizarDetalhes() -->
    </div>
  `;

      content.innerHTML = html;

      const inp = document.getElementById("novoJogoInput");
      if (inp) inp.addEventListener("keydown", e => { if (e.key === "Enter") adicionarJogo(); });

      // Renderiza detalhes do jogo inicial
      renderizarDetalhes(_jogoSelecionado);
    }

    // ── Retorna HTML do Card na Lista ────────────────────────────
    function getGameCardHtml(nomeJogo, dataJogo, dadosJogo, isActive) {
      const parceiros = dadosJogo?.parceiros || {};
      const historico = [...(dadosJogo?.historico || [])].reverse();
      const totalParceiros = Object.keys(parceiros).length;
      const temDados = dadosJogo !== null;

      const totalMudancasHoje = historico.filter(h => {
        const d = new Date(h.data?.split(' ')[0]?.split('/').reverse().join('-'));
        return d.toDateString() === new Date().toDateString();
      }).length;

      const temErro = Object.values(parceiros).some(p => p.erro);
      const dataDisplay = dataJogo || '—';

      const activeClass = isActive ? " active" : "";
      const jogoSafeNome = nomeJogo.replace(/'/g, "\\'");

      return `
    <div class="jogo-card${activeClass}" onclick="selecionarJogo('${jogoSafeNome}')" id="card-${nomeJogo.replace(/[^a-zA-Z0-9]/g, "_")}">
      <div class="jogo-card-header">
        <div class="jogo-badge">🗓 ${dataDisplay}</div>
        <button class="game-remove-btn icon-only" onclick="removerJogo('${jogoSafeNome}', event)" title="Remover Jogo">✕</button>
      </div>

      <div class="jogo-titulo">${nomeJogo}</div>

      <div class="jogo-meta">
        ${temDados
          ? `<div class="meta-item"><span class="meta-dot"></span> ${totalParceiros} parceiro(s)</div>`
          : `<div class="meta-item" style="color:var(--muted)">⏳ Aguardando scraper</div>`
        }
        ${totalMudancasHoje > 0 ? `<div class="meta-item" style="color:var(--red)">⚠ ${totalMudancasHoje} mudança(s) hoje</div>` : ''}
        ${temErro ? `<div class="meta-item" style="color:var(--yellow)">⚡ Sites com erro</div>` : ''}
      </div>
    </div>
  `;
    }

    // ── Açao ao Clicar num Card ──────────────────────────────────
    function selecionarJogo(nomeJogo) {
      if (_jogoSelecionado === nomeJogo) return;

      // Atualiza classes active
      const oldActive = document.querySelector('.jogo-card.active');
      if (oldActive) oldActive.classList.remove('active');

      const novoCard = document.getElementById("card-" + nomeJogo.replace(/[^a-zA-Z0-9]/g, "_"));
      if (novoCard) {
        novoCard.classList.add('active');
        // Scrolla levemente para garantir que o card está visível, mas sem pular a página toda
        novoCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      _jogoSelecionado = nomeJogo;
      renderizarDetalhes(nomeJogo);
    }

    // ── Renderiza Detalhes Abaixo da Lista ─────────────────────────────
    function renderizarDetalhes(nomeJogo) {
      let dadosFormatados = _dadosGlobais || {};
      if (_dadosGlobais?.jogo && _dadosGlobais?.parceiros) {
        dadosFormatados = {
          [_dadosGlobais.jogo]: {
            parceiros: _dadosGlobais.parceiros,
            atualizado_em: _dadosGlobais.atualizado_em,
            historico: _dadosGlobais.historico || []
          }
        };
      }

      const dadosJogo = dadosFormatados[nomeJogo];
      const container = document.getElementById("game-details-area");

      if (!dadosJogo) {
        if (container) container.innerHTML = `<div class="erro-msg" style="padding:40px;text-align:center;color:var(--muted)">
          <div style="font-size:36px;margin-bottom:12px">⏳</div>
          <div>Nenhum dado coletado ainda para <strong style="color:var(--text)">${nomeJogo}</strong>.<br>Rode <code>python scraper.py</code> para buscar os preços.</div>
        </div>`;
        return;
      }

      const parceiros = dadosJogo.parceiros || {};
      const historico = [...(dadosJogo.historico || [])].reverse();

      let html = `
    <div class="parceiros-titulo">
      PARCEIROS MONITORA DOS — ${nomeJogo.toUpperCase()}
    </div>
  `;

      // Ordena parceiros por atualizado_em (mais recente primeiro)
      const parceirosSorted = Object.values(parceiros).sort((a, b) =>
        parseBRDate(b.atualizado_em) - parseBRDate(a.atualizado_em)
      );

      html += `<div class="parceiros-grid">`;
      parceirosSorted.forEach(p => { html += renderizarParceiroCard(p); });
      html += `</div>`;

      html += renderizarHistorico(historico);

      if (container) {
        container.innerHTML = html;
        // Força reflow p/ disparar animação se necessário
        container.style.animation = 'none';
        container.offsetHeight; /* trigger reflow */
        container.style.animation = null;
      }
    }

    // ── Card compacto de parceiro (grid) ─────────────────────────
    function renderizarParceiroCard(p) {
      const ingressos = p.ingressos || [];
      const temMudanca = p.mudancas && p.mudancas.length > 0;
      const temErro = !!p.erro;
      const initials = p.nome.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      const cor = p.cor || '#888';

      const badge = temErro
        ? `<span class="badge-erro">ERRO</span>`
        : temMudanca
          ? `<span class="badge-mudanca">⚑ MUDOU</span>`
          : `<span class="badge-ok">OK</span>`;

      let rowsHtml = '';
      if (temErro) {
        rowsHtml = `<div style="font-size:11px;color:var(--red);margin:4px 0 8px">${p.erro.slice(0, 80)}</div>`;
      } else if (ingressos.length > 0) {
        rowsHtml = `<div class="parceiro-card-rows">` +
          ingressos.map(ing => {
            const mudou = (p.mudancas || []).some(m => m.setor === ing.setor);
            const semP = !ing.preco || ing.preco === '-' || ing.preco === 'Ver no site' || ing.preco === 'Link nao encontrado';
            return `<div class="parceiro-card-row${mudou ? ' mudou' : ''}">
          <span>${ing.setor || '—'}</span>
          <span class="tk-p">${semP ? '—' : ing.preco}</span>
        </div>`;
          }).join('') +
          `</div>`;
      } else {
        rowsHtml = `<div style="font-size:11px;color:var(--muted);margin:4px 0 8px">Nenhum preço encontrado</div>`;
      }

      return `
  <div class="parceiro-card${temMudanca ? ' tem-mudanca' : ''}">
    <div class="parceiro-card-header">
      <div class="parceiro-card-info">
        <div class="avatar" style="background:${cor}18;color:${cor};width:34px;height:34px;font-size:13px;border-radius:8px">${initials}</div>
        <div>
          <div class="parceiro-card-name">${p.nome}</div>
          <div class="parceiro-card-sub">${ingressos.length} tipo(s)</div>
        </div>
      </div>
      ${badge}
    </div>
    ${rowsHtml}
    <div class="parceiro-card-foot">
      <span>${p.atualizado_em || '—'}</span>
      <a href="${p.url_evento || p.url_base || '#'}" target="_blank" class="link-site" style="font-size:11px">Abrir →</a>
    </div>
  </div>`;
    }

    // ── Tabela de histórico ──────────────────────────────────────
    function renderizarHistorico(historico) {
      return `
  <div class="historico-wrap">
    <div class="historico-header">HISTÓRICO DE MUDANÇAS</div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Data/Hora</th><th>Parceiro</th><th>Setor</th>
            <th>Antes</th><th>Depois</th><th>Variação</th>
          </tr>
        </thead>
        <tbody>
          ${historico.length === 0
          ? `<tr><td colspan="6" class="empty-hist">Nenhuma mudança de preço registrada ainda.</td></tr>`
          : historico.slice(0, 50).map(h => {
            const av = parsePreco(h.preco_anterior), nv = parsePreco(h.preco_novo);
            let pill = '';
            if (av && nv) {
              const diff = nv - av;
              pill = diff > 0
                ? `<span class="pill pill-up">▲ +R$${Math.abs(diff).toFixed(2)}</span>`
                : `<span class="pill pill-down">▼ -R$${Math.abs(diff).toFixed(2)}</span>`;
            }
            return `<tr>
                  <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">${h.data}</td>
                  <td>${h.parceiro}</td>
                  <td style="font-size:12px">${h.setor}</td>
                  <td style="font-family:'JetBrains Mono',monospace;color:var(--muted)">${h.preco_anterior || '—'}</td>
                  <td style="font-family:'JetBrains Mono',monospace;color:var(--accent)">${h.preco_novo}</td>
                  <td>${pill}</td>
                </tr>`;
          }).join('')
        }
        </tbody>
      </table>
    </div>
  </div>`;
    }

    // ── Header timestamp ─────────────────────────────────────────
    function atualizarHeaderTime(dados) {
      let ts = "";
      // Check flat vs formatado
      if (dados.atualizado_em) {
        ts = dados.atualizado_em;
      } else {
        const vals = Object.values(dados);
        if (vals.length > 0 && vals[0].atualizado_em) ts = vals[0].atualizado_em;
      }
      document.getElementById("headerTime").textContent = ts ? "Atualizado: " + ts : "—";
    }

    // ── Toggles ──────────────────────────────────────────────────
    function toggleAcc(el) {
      el.classList.toggle('aberto');
    }

    // ── Parse preço ──────────────────────────────────────────────
    function parsePreco(str) {
      if (!str) return null;
      const m = str.replace(/\./g, '').replace(',', '.').match(/[\d]+\.?\d*/);
      return m ? parseFloat(m[0]) : null;
    }

    // ── API config ───────────────────────────────────────────────
    async function buscarPrecos() {
      const btn = document.getElementById("scrapeBtn");
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "Buscando...";
      try {
        const r = await fetch("/run-scraper", { method: "POST" });
        const j = await r.json();
        if (r.ok) {
          mostrarToast("Preços atualizados!");
          await carregarDados();
        } else {
          mostrarToast("Erro: " + (j.erro || "falha desconhecida"), true);
        }
      } catch (e) {
        mostrarToast("Erro ao buscar preços: " + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Buscar Preços";
      }
    }

    async function adicionarJogo() {
      const inp = document.getElementById("novoJogoInput");
      const inpData = document.getElementById("novoJogoData");
      const btn = document.querySelector(".add-game-btn");
      const jogo = inp?.value.trim();
      const data = inpData?.value.trim() || "";
      if (!jogo) return;

      if (btn) { btn.disabled = true; btn.textContent = "Salvando..."; }
      try {
        if (isGHConfigured()) {
          const jogos = (_configGlobal?.jogos || [])
            .map(j => typeof j === 'string' ? { nome: j, data: '' } : j);
          if (!jogos.some(j => j.nome === jogo)) jogos.push({ nome: jogo, data });
          await ghUpdateConfig({ jogos });
          mostrarToast(`✓ "${jogo}" adicionado!\nO scraper rodará automaticamente no próximo ciclo.`);
        } else {
          const r = await fetch("/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "add", jogo, data })
          });
          if (!r.ok) throw new Error("Erro ao salvar");
          mostrarToast(`✓ "${jogo}" adicionado!\nRode <code>python scraper.py</code> para buscar os preços.`);
        }
        if (inp) inp.value = "";
        if (inpData) inpData.value = "";
      } catch (e) {
        mostrarToast("Erro ao adicionar: " + e.message, true);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = "Adicionar"; }
      }
    }

    async function removerJogo(nomeJogo, event) {
      event.stopPropagation();
      if (!confirm(`Remover "${nomeJogo}" do monitoramento?`)) return;
      try {
        if (isGHConfigured()) {
          const jogos = (_configGlobal?.jogos || [])
            .map(j => typeof j === 'string' ? { nome: j, data: '' } : j)
            .filter(j => j.nome !== nomeJogo);
          await ghUpdateConfig({ jogos });
          _configGlobal = { jogos };
          mostrarToast(`✓ "${nomeJogo}" removido.`);
        } else {
          const r = await fetch("/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "remove", jogo: nomeJogo })
          });
          if (!r.ok) throw new Error("Erro ao salvar");
          _configGlobal = {
            jogos: (_configGlobal?.jogos || [])
              .map(j => typeof j === 'string' ? { nome: j, data: '' } : j)
              .filter(j => j.nome !== nomeJogo)
          };
          mostrarToast(`✓ "${nomeJogo}" removido do config.`);
        }
        if (_jogoSelecionado === nomeJogo) _jogoSelecionado = null;
        if (_dadosGlobais && _dadosGlobais[nomeJogo]) delete _dadosGlobais[nomeJogo];
        renderizarTudo(_dadosGlobais || {}, _configGlobal);
      } catch (e) {
        mostrarToast("Erro ao remover: " + e.message, true);
      }
    }

    // ── Toast ────────────────────────────────────────────────────
    function mostrarToast(msg, erro = false) {
      const t = document.createElement("div");
      const cor = erro ? '#ff4d6d' : '#00ff88';
      t.style.cssText = `position:fixed;bottom:20px;right:20px;background:#131320;border:1px solid ${cor};border-radius:12px;padding:16px 20px;max-width:340px;z-index:999;font-size:13px;line-height:1.7;color:${cor};`;
      t.innerHTML = msg.replace(/\n/g, '<br>') +
        `<br><button onclick="this.parentElement.remove()" style="margin-top:8px;background:${cor};color:#07070f;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:12px;">OK</button>`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 10000);
    }

    // ── Boot ─────────────────────────────────────────────────────
    carregar();
    setInterval(carregar, 60000);
  </script>
</body>

</html>

name: Scraper de Ingressos

on:
  schedule:
    - cron: '0 */9 * * *'   # a cada 9 horas (00:00, 09:00, 18:00)
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          cd scrapping
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Restaurar sessão Arena Kids
        run: |
          echo '${{ secrets.INGRESSE_STATE }}' > scrapping/ingresse_state.json

      - name: Rodar scraper
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          cd scrapping
          python scraper.py
